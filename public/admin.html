<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RZVPN | پنل مدیریت</title>
<meta name="theme-color" content="#060810">
<style>
*{box-sizing:border-box}
body{
 margin:0;background:
 radial-gradient(circle at 0 0,#123c5d55,transparent 30%),
 radial-gradient(circle at 100% 10%,#59236b44,transparent 30%),#060810;
 color:#f4f7ff;font-family:Tahoma,Arial,sans-serif
}
.container{width:min(1200px,94%);margin:auto}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.loginBox{
 width:min(430px,100%);padding:32px;border-radius:25px;
 background:#0d1321eF;border:1px solid #ffffff12;
 box-shadow:0 25px 80px #0008;text-align:center
}
.logo{font-size:35px;font-weight:900}.logo span{color:#20bfff}
input,textarea,select{
 width:100%;padding:13px 14px;margin:6px 0 13px;
 background:#080c15;color:#fff;border:1px solid #ffffff12;
 border-radius:12px;outline:none;font-family:inherit
}
input:focus,textarea:focus{border-color:#24bfff66;box-shadow:0 0 0 3px #24bfff0d}
button{
 border:0;border-radius:12px;padding:12px 16px;color:white;
 background:linear-gradient(135deg,#08aef7,#7757f4);
 cursor:pointer;font-family:inherit;font-weight:bold
}
button.secondary{background:#ffffff0a;border:1px solid #ffffff12}
button.danger{background:#ef4444}
button.green{background:#16a34a}
.top{
 position:sticky;top:0;z-index:10;background:#060810e8;
 backdrop-filter:blur(18px);border-bottom:1px solid #ffffff0d
}
.topin{height:70px;display:flex;align-items:center;justify-content:space-between}
.layout{padding:25px 0 50px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.stat{
 padding:18px;border:1px solid #ffffff10;border-radius:18px;
 background:linear-gradient(145deg,#111827,#0a0f1b)
}
.stat b{font-size:26px;display:block;margin-top:5px;color:#5dd4ff}
.section{
 margin-top:18px;padding:22px;border-radius:20px;
 background:#0d1320;border:1px solid #ffffff0d
}
.section h2{margin-top:0}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px}
.full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.productList{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.product{
 padding:17px;border-radius:17px;background:#080d17;
 border:1px solid #ffffff0c
}
.product.off{opacity:.5}
.product h3{margin:0 0 10px}
.price{font-size:22px;color:#5ed3ff;font-weight:bold}
.meta{color:#9aa6ba;font-size:13px;line-height:2}
.links{display:grid;gap:10px}
.link{
 padding:15px;border-radius:15px;background:#080d17;
 border:1px solid #ffffff0c
}
.linkurl{
 display:block;margin:8px 0;color:#5dd4ff;word-break:break-all;font-size:13px
}
.checks{
 max-height:260px;overflow:auto;padding:8px;
 border:1px solid #ffffff0c;border-radius:14px;background:#080d17
}
.check{display:flex;gap:10px;align-items:center;padding:9px;border-bottom:1px solid #ffffff08}
.check input{width:auto;margin:0}
.msg{margin-top:12px;padding:11px;border-radius:12px;display:none}
.ok{background:#16a34a22;color:#76efaa}.err{background:#ef444422;color:#ff9292}
@media(max-width:850px){
 .stats,.productList{grid-template-columns:1fr}
 .formgrid{grid-template-columns:1fr}
 .full{grid-column:auto}
}
</style>
</head>
<body>

<div id="login" class="login">
 <div class="loginBox">
  <div class="logo">RZ<span>VPN</span></div>
  <p style="color:#929db0">پنل مدیریت حرفه‌ای</p>
  <input id="password" type="password" placeholder="رمز مدیریت">
  <button style="width:100%" onclick="login()">🔐 ورود به پنل</button>
  <div id="loginMsg" class="msg err"></div>
 </div>
</div>

<div id="app" style="display:none">
<header class="top">
 <div class="container topin">
  <div class="logo">RZ<span>VPN</span></div>
  <div class="actions">
   <a href="/" target="_blank"><button class="secondary">🌐 سایت</button></a>
   <button class="danger" onclick="logout()">خروج</button>
  </div>
 </div>
</header>

<main class="container layout">

<div class="stats">
 <div class="stat">📦 محصولات فعال <b id="activeCount">0</b></div>
 <div class="stat">💎 کل محصولات <b id="totalCount">0</b></div>
 <div class="stat">🔗 لینک‌های قیمت <b id="linkCount">0</b></div>
</div>

<section class="section">
 <h2>➕ افزودن / ویرایش محصول</h2>

 <div class="formgrid">
  <div>
   <label>نام محصول</label>
   <input id="name" placeholder="مثلاً #40 پاسارگاد">
  </div>
  <div>
   <label>قیمت</label>
   <input id="price" placeholder="337,500 تومان">
  </div>
  <div>
   <label>حجم</label>
   <input id="volume" placeholder="150GB">
  </div>
  <div>
   <label>مدت</label>
   <input id="duration" placeholder="30 روزه">
  </div>
  <div>
   <label>لوکیشن</label>
   <input id="location" placeholder="ترکیه">
  </div>
  <div>
   <label>پروتکل</label>
   <input id="protocol" placeholder="VLESS">
  </div>
  <div class="full">
   <label>لوکیشن‌ها</label>
   <input id="locations" placeholder="🇩🇪 🇫🇷 🇹🇷 🇵🇱">
  </div>
  <div class="full">
   <label>تونل</label>
   <input id="tunnel" placeholder="TUNEL IRAN 🇸🇪🇩🇪">
  </div>
  <div class="full">
   <label>توضیحات</label>
   <textarea id="description" rows="3"></textarea>
  </div>
 </div>

 <div class="actions">
  <button onclick="saveProduct()">💾 ذخیره محصول</button>
  <button class="secondary" onclick="clearForm()">پاک کردن فرم</button>
 </div>
 <div id="productMsg" class="msg"></div>
</section>

<section class="section">
 <h2>📦 محصولات</h2>
 <div id="productList" class="productList"></div>
</section>

<section class="section">
 <h2>🔗 ساخت لینک لیست قیمت</h2>
 <p style="color:#8e99ad">چند محصول را انتخاب کن تا یک لینک قیمت مشترک ساخته شود.</p>

 <input id="linkTitle" placeholder="عنوان لینک، مثلاً لیست قیمت مهر">

 <div id="checks" class="checks"></div>

 <br>
 <button onclick="createLink()">🔗 ساخت لینک</button>
 <div id="linkMsg" class="msg"></div>
</section>

<section class="section">
 <h2>🌐 لینک‌های قیمت ساخته‌شده</h2>
 <div id="links" class="links"></div>
</section>

</main>
</div>

<script>
let token=localStorage.getItem("rzvpn_admin_token")||"";
let products=[];
let editingId=null;

const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));

function headers(){
 return {
  "Content-Type":"application/json",
  "Authorization":"Bearer "+token
 };
}

async function api(url,opt={}){
 opt.headers={...(opt.headers||{}),...headers()};
 const r=await fetch(url,opt);
 let data={};
 try{data=await r.json()}catch(e){}
 if(!r.ok)throw new Error(data.error||"خطا در ارتباط با سرور");
 return data;
}

async function login(){
 const pass=$("password").value.trim();
 if(!pass)return;

 try{
  const r=await fetch("/api/admin/login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({password:pass})
  });
  const d=await r.json();

  if(!r.ok)throw new Error(d.error||"رمز اشتباه است");

  token=d.token||pass;
  localStorage.setItem("rzvpn_admin_token",token);
  showApp();
 }catch(e){
  $("loginMsg").textContent=e.message;
  $("loginMsg").style.display="block";
 }
}

function showApp(){
 $("login").style.display="none";
 $("app").style.display="block";
 loadAll();
}

function logout(){
 localStorage.removeItem("rzvpn_admin_token");
 location.reload();
}

async function loadAll(){
 await loadProducts();
 await loadLinks();
}

async function loadProducts(){
 try{
  products=await api("/api/products");
  if(!Array.isArray(products))products=[];
  renderProducts();
  renderChecks();
  $("totalCount").textContent=products.length;
  $("activeCount").textContent=products.filter(p=>p.active!==false).length;
 }catch(e){
  $("productList").innerHTML='<div class="msg err" style="display:block">جلسه مدیریت منقضی شده یا دسترسی ندارید.</div>';
 }
}

function renderProducts(){
 $("productList").innerHTML=products.length?products.map(p=>`
  <div class="product ${p.active===false?"off":""}">
   <h3>${esc(p.name)}</h3>
   <div class="price">${esc(p.price||"-")}</div>
   <div class="meta">
    📦 ${esc(p.volume||"-")}<br>
    ⏱ ${esc(p.duration||"-")}<br>
    ${p.locations?"🌍 "+esc(p.locations)+"<br>":""}
    ${p.protocol?"🔐 "+esc(p.protocol)+"<br>":""}
    وضعیت: ${p.active===false?"غیرفعال":"فعال"}
   </div>
   <div class="actions" style="margin-top:10px">
    <button onclick="editProduct('${esc(p.id)}')">✏️ ویرایش</button>
    <button class="secondary" onclick="toggleProduct('${esc(p.id)}')">
     ${p.active===false?"فعال‌سازی":"غیرفعال‌سازی"}
    </button>
    <button class="danger" onclick="deleteProduct('${esc(p.id)}')">🗑 حذف</button>
   </div>
  </div>
 `).join(""):'<div class="msg" style="display:block">محصولی وجود ندارد.</div>';
}

function renderChecks(){
 $("checks").innerHTML=products.filter(p=>p.active!==false).map(p=>`
  <label class="check">
   <input type="checkbox" value="${esc(p.id)}">
   <span><b>${esc(p.name)}</b> — ${esc(p.volume||"")} — ${esc(p.price||"")}</span>
  </label>
 `).join("")||'<div style="padding:12px;color:#8994a8">محصول فعال وجود ندارد.</div>';
}

function fill(id,value){
 $(id).value=value??"";
}

function editProduct(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;
 editingId=id;
 fill("name",p.name);fill("price",p.price);fill("volume",p.volume);
 fill("duration",p.duration);fill("location",p.location);
 fill("protocol",p.protocol);fill("locations",p.locations);
 fill("tunnel",p.tunnel);fill("description",p.description);
 window.scrollTo({top:0,behavior:"smooth"});
}

function clearForm(){
 editingId=null;
 ["name","price","volume","duration","location","protocol","locations","tunnel","description"].forEach(x=>fill(x,""));
}

async function saveProduct(){
 const body={
  name:$("name").value.trim(),
  price:$("price").value.trim(),
  volume:$("volume").value.trim(),
  duration:$("duration").value.trim(),
  location:$("location").value.trim(),
  protocol:$("protocol").value.trim(),
  locations:$("locations").value.trim(),
  tunnel:$("tunnel").value.trim(),
  description:$("description").value.trim()
 };

 if(!body.name){
  show("productMsg","نام محصول را وارد کن","err");return;
 }

 try{
  if(editingId){
   await api("/api/products/"+encodeURIComponent(editingId),{
    method:"PUT",body:JSON.stringify(body)
   });
   show("productMsg","محصول با موفقیت ویرایش شد","ok");
  }else{
   await api("/api/products",{
    method:"POST",body:JSON.stringify(body)
   });
   show("productMsg","محصول با موفقیت اضافه شد","ok");
  }
  clearForm();
  await loadProducts();
 }catch(e){show("productMsg",e.message,"err")}
}

async function toggleProduct(id){
 try{
  const p=products.find(x=>x.id===id);
  await api("/api/products/"+encodeURIComponent(id),{
   method:"PUT",body:JSON.stringify({...p,active:p.active===false})
  });
  loadProducts();
 }catch(e){alert(e.message)}
}

async function deleteProduct(id){
 if(!confirm("این محصول حذف شود؟"))return;
 try{
  await api("/api/products/"+encodeURIComponent(id),{method:"DELETE"});
  loadProducts();
 }catch(e){alert(e.message)}
}

async function createLink(){
 const ids=[...document.querySelectorAll("#checks input:checked")].map(x=>x.value);
 if(!ids.length){show("linkMsg","حداقل یک محصول انتخاب کن","err");return}

 try{
  const d=await api("/api/pricing-links",{
   method:"POST",
   body:JSON.stringify({
    title:$("linkTitle").value.trim()||"لیست قیمت RZVPN",
    productIds:ids
   })
  });
  $("linkTitle").value="";
  document.querySelectorAll("#checks input").forEach(x=>x.checked=false);
  show("linkMsg","لینک با موفقیت ساخته شد","ok");
  await loadLinks();
 }catch(e){show("linkMsg",e.message,"err")}
}

async function loadLinks(){
 try{
  const links=await api("/api/pricing-links");
  $("linkCount").textContent=Array.isArray(links)?links.length:0;

  $("links").innerHTML=Array.isArray(links)&&links.length?links.map(x=>{
   const url=location.origin+"/pricing/"+encodeURIComponent(x.token);
   return `
    <div class="link">
     <b>🔗 ${esc(x.title||"لیست قیمت")}</b>
     <span class="linkurl">${esc(url)}</span>
     <div class="actions">
      <button onclick="copyText('${esc(url)}')">📋 کپی لینک</button>
      <button class="secondary" onclick="window.open('${esc(url)}','_blank')">🌐 مشاهده</button>
      <button class="secondary" onclick="toggleLink('${esc(x.token)}')">
       ${x.active===false?"فعال‌سازی":"غیرفعال‌سازی"}
      </button>
      <button class="danger" onclick="deleteLink('${esc(x.token)}')">🗑 حذف</button>
     </div>
    </div>
   `;
  }).join(""):'<div style="color:#8d98ab">هنوز لینک قیمتی ساخته نشده.</div>';
 }catch(e){
  $("links").innerHTML='<div style="color:#ff9292">خطا در دریافت لینک‌ها</div>';
 }
}

async function toggleLink(t){
 try{
  await api("/api/pricing-links/"+encodeURIComponent(t)+"/toggle",{method:"POST"});
  loadLinks();
 }catch(e){alert(e.message)}
}

async function deleteLink(t){
 if(!confirm("این لینک حذف شود؟"))return;
 try{
  await api("/api/pricing-links/"+encodeURIComponent(t),{method:"DELETE"});
  loadLinks();
 }catch(e){alert(e.message)}
}

async function copyText(t){
 try{
  await navigator.clipboard.writeText(t);
  alert("لینک کپی شد ✅");
 }catch(e){
  prompt("لینک:",t);
 }
}

function show(id,text,type){
 const x=$(id);
 x.textContent=text;
 x.className="msg "+type;
 x.style.display="block";
 setTimeout(()=>x.style.display="none",3500);
}

if(token)showApp();
</script>
</body>
</html>
