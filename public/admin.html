<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RZVPN | مدیریت</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Tahoma,Arial;
background:#070812;
color:#fff;
}

header{
padding:20px;
background:#0e1121;
border-bottom:1px solid #292f4c;
}

.logo{
font-size:27px;
font-weight:bold;
color:#55b7ff;
}

.container{
max-width:1200px;
margin:auto;
padding:20px 15px 50px;
}

.login{
max-width:420px;
margin:80px auto;
background:#111526;
border:1px solid #2c3353;
border-radius:22px;
padding:25px;
}

.panel{
background:#101423;
border:1px solid #282f4e;
border-radius:20px;
padding:20px;
margin-bottom:20px;
}

input,textarea,select{
width:100%;
background:#080a14;
border:1px solid #303752;
color:white;
border-radius:11px;
padding:12px;
margin:6px 0 12px;
font-family:inherit;
}

textarea{
min-height:90px;
resize:vertical;
}

button{
border:0;
border-radius:11px;
padding:11px 15px;
background:#168cff;
color:white;
font-weight:bold;
cursor:pointer;
margin:4px;
}

button.red{background:#c93345}
button.gray{background:#30364d}
button.green{background:#168b50}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:15px;
}

.card{
background:#15192a;
border:1px solid #2b3150;
border-radius:18px;
padding:16px;
}

.card h3{
margin-top:0;
color:#65bdff;
}

.muted{
color:#9298af;
font-size:13px;
line-height:1.9;
}

.badge{
display:inline-block;
padding:5px 9px;
border-radius:20px;
background:#174a31;
color:#8dffb4;
font-size:12px;
}

.badge.off{
background:#49202a;
color:#ff9aaa;
}

.hidden{
display:none;
}

table{
width:100%;
border-collapse:collapse;
overflow:hidden;
}

th,td{
padding:10px;
border-bottom:1px solid #292f49;
text-align:right;
vertical-align:top;
}

.order{
margin-bottom:12px;
padding:15px;
border:1px solid #2b3150;
border-radius:15px;
background:#14182a;
}

.linkbox{
padding:14px;
background:#080b15;
border-radius:13px;
margin:10px 0;
word-break:break-all;
}
</style>
</head>

<body>

<header>
<div class="logo">RZVPN — مدیریت</div>
</header>

<div id="loginBox" class="login">

<h2>ورود مدیر</h2>

<p class="muted">
برای ورود به پنل مدیریت رمز مدیر را وارد کنید.
</p>

<input id="password" type="password" placeholder="رمز مدیریت">

<button onclick="login()">ورود به پنل</button>

<p id="loginError"></p>

</div>

<div id="app" class="container hidden">

<div class="panel">

<h2>➕ افزودن / ویرایش محصول</h2>

<input type="hidden" id="editId">

<label>نام محصول</label>
<input id="name" placeholder="مثلاً تک لوکیشن">

<label>قیمت</label>
<input id="price" placeholder="مثلاً 150,000 تومان">

<label>حجم</label>
<input id="volume" placeholder="مثلاً 100 گیگ">

<label>مدت</label>
<input id="duration" placeholder="مثلاً 30 روز">

<label>لوکیشن</label>
<input id="location" placeholder="مثلاً ترکیه 🇹🇷">

<label>پروتکل</label>
<input id="protocol" placeholder="مثلاً WireGuard + Amnezia">

<label>توضیحات</label>
<textarea id="description"></textarea>

<button onclick="saveProduct()">💾 ذخیره محصول</button>
<button class="gray" onclick="clearForm()">پاک کردن فرم</button>

</div>

<div class="panel">

<h2>📦 محصولات</h2>

<div id="products" class="grid"></div>

</div>

<div class="panel">

<h2>🔗 ساخت لینک عمومی قیمت</h2>

<p class="muted">
محصولات موردنظر را انتخاب کنید و یک لینک عمومی برای مشتری بسازید.
</p>

<div id="selectProducts"></div>

<button onclick="createLink()">
🔗 ساخت لینک
</button>

<div id="links"></div>

</div>

<div class="panel">

<h2>🛒 سفارش‌های مشتریان</h2>

<div id="orders">
در حال دریافت سفارش‌ها...
</div>

</div>

</div>

<script>

let TOKEN="";
let products=[];

function authHeaders(){

return {
"Content-Type":"application/json",
"Authorization":"Bearer "+TOKEN
};

}

async function login(){

const password=document.getElementById("password").value;

const res=await fetch("/api/admin/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({password})
});

const data=await res.json();

if(!data.success){

document.getElementById("loginError").textContent=
"❌ "+data.error;

return;

}

TOKEN=data.token;

sessionStorage.setItem("rzvpn_admin_token",TOKEN);

showApp();

loadAll();

}

function showApp(){

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

}

async function loadAll(){

await loadProducts();
await loadLinks();
await loadOrders();

}

async function loadProducts(){

const res=await fetch("/api/admin/products",{
headers:authHeaders()
});

if(res.status===401){
logout();
return;
}

products=await res.json();

renderProducts();
renderSelectProducts();

}

function renderProducts(){

const box=document.getElementById("products");

if(!products.length){

box.innerHTML="<p>هنوز محصولی ساخته نشده است.</p>";

return;

}

box.innerHTML=products.map(p=>`

<div class="card">

<h3>${esc(p.name)}</h3>

<div class="muted">
💰 ${esc(p.price || "-")}<br>
📦 ${esc(p.volume || "-")}<br>
⏱ ${esc(p.duration || "-")}<br>
📍 ${esc(p.location || "-")}<br>
🔐 ${esc(p.protocol || "-")}<br>
${esc(p.description || "")}
</div>

<p>
<span class="badge ${p.active===false?"off":""}">
${p.active===false?"غیرفعال":"فعال"}
</span>
</p>

<button onclick="editProduct('${p.id}')">✏️ ویرایش</button>

<button class="gray"
onclick="toggleProduct('${p.id}')">
${p.active===false?"فعال کردن":"غیرفعال کردن"}
</button>

<button class="red"
onclick="deleteProduct('${p.id}')">
حذف
</button>

</div>

`).join("");

}

function renderSelectProducts(){

const box=document.getElementById("selectProducts");

box.innerHTML=products
.filter(p=>p.active!==false)
.map(p=>`

<label style="display:block;margin:10px 0">
<input type="checkbox"
class="productCheck"
value="${p.id}"
style="width:auto">
${esc(p.name)} — ${esc(p.price || "")}
</label>

`).join("");

}

async function saveProduct(){

const body={
name:document.getElementById("name").value,
price:document.getElementById("price").value,
volume:document.getElementById("volume").value,
duration:document.getElementById("duration").value,
location:document.getElementById("location").value,
protocol:document.getElementById("protocol").value,
description:document.getElementById("description").value,
active:true
};

const editId=document.getElementById("editId").value;

let url="/api/admin/products";
let method="POST";

if(editId){

url+="/"+editId;
method="PUT";

}

const res=await fetch(url,{
method,
headers:authHeaders(),
body:JSON.stringify(body)
});

const data=await res.json();

if(!res.ok){

alert(data.error || "خطا");

return;

}

clearForm();
await loadProducts();

alert("محصول ذخیره شد.");

}

function editProduct(id){

const p=products.find(x=>String(x.id)===String(id));

if(!p)return;

document.getElementById("editId").value=p.id;
document.getElementById("name").value=p.name||"";
document.getElementById("price").value=p.price||"";
document.getElementById("volume").value=p.volume||"";
document.getElementById("duration").value=p.duration||"";
document.getElementById("location").value=p.location||"";
document.getElementById("protocol").value=p.protocol||"";
document.getElementById("description").value=p.description||"";

window.scrollTo({top:0,behavior:"smooth"});

}

function clearForm(){

[
"editId",
"name",
"price",
"volume",
"duration",
"location",
"protocol",
"description"
].forEach(id=>{
document.getElementById(id).value="";
});

}

async function toggleProduct(id){

await fetch("/api/admin/products/"+id+"/toggle",{
method:"POST",
headers:authHeaders()
});

loadProducts();

}

async function deleteProduct(id){

if(!confirm("این محصول حذف شود؟"))return;

await fetch("/api/admin/products/"+id,{
method:"DELETE",
headers:authHeaders()
});

loadProducts();

}

async function createLink(){

const ids=[...document.querySelectorAll(".productCheck:checked")]
.map(x=>x.value);

if(!ids.length){

alert("حداقل یک محصول انتخاب کنید.");

return;

}

const res=await fetch("/api/pricing-links",{
method:"POST",
headers:authHeaders(),
body:JSON.stringify({productIds:ids})
});

const data=await res.json();

if(!res.ok){

alert(data.error);

return;

}

const full=location.origin+data.url;

alert("لینک ساخته شد:\n\n"+full);

await loadLinks();

}

async function loadLinks(){

const res=await fetch("/api/pricing-links",{
headers:authHeaders()
});

if(!res.ok)return;

const links=await res.json();

const box=document.getElementById("links");

if(!links.length){

box.innerHTML="<p>هنوز لینکی ساخته نشده است.</p>";

return;

}

box.innerHTML=links.map(l=>{

const url=location.origin+"/pricing/"+l.token;

const names=l.productIds.map(id=>{
const p=products.find(x=>String(x.id)===String(id));
return p?p.name:"محصول حذف‌شده";
});

return `

<div class="linkbox">

<b>${names.map(esc).join("، ")}</b>

<br><br>

<a href="${url}" target="_blank" style="color:#55b7ff">
${url}
</a>

<br><br>

<span class="badge ${l.active===false?"off":""}">
${l.active===false?"غیرفعال":"فعال"}
</span>

<br>

<button onclick="copyText('${url}')">
📋 کپی لینک
</button>

<button class="gray"
onclick="toggleLink('${l.token}')">
${l.active===false?"فعال کردن":"غیرفعال کردن"}
</button>

<button class="red"
onclick="deleteLink('${l.token}')">
حذف
</button>

</div>

`;

}).join("");

}

async function toggleLink(token){

await fetch("/api/pricing-links/"+token+"/toggle",{
method:"POST",
headers:authHeaders()
});

loadLinks();

}

async function deleteLink(token){

if(!confirm("این لینک حذف شود؟"))return;

await fetch("/api/pricing-links/"+token,{
method:"DELETE",
headers:authHeaders()
});

loadLinks();

}

async function copyText(text){

await navigator.clipboard.writeText(text);

alert("لینک کپی شد.");

}

async function loadOrders(){

const res=await fetch("/api/admin/orders",{
headers:authHeaders()
});

if(!res.ok)return;

const orders=await res.json();

const box=document.getElementById("orders");

if(!orders.length){

box.innerHTML="<p>هنوز سفارشی ثبت نشده است.</p>";

return;

}

box.innerHTML=orders.map(o=>`

<div class="order">

<b>👤 ${esc(o.customerName)}</b>

<div class="muted">

📦 محصول: ${esc(o.productName)}<br>
💰 قیمت: ${esc(o.productPrice || "-")}<br>
📞 تماس: ${esc(o.contact)}<br>
📝 توضیح: ${esc(o.note || "-")}<br>
🕐 ${new Date(o.createdAt).toLocaleString("fa-IR")}

</div>

<select onchange="changeOrderStatus('${o.id}',this.value)">

${[
"جدید",
"در حال بررسی",
"تکمیل شده",
"لغو شده"
].map(s=>`

<option ${o.status===s?"selected":""}>
${s}
</option>

`).join("")}

</select>

<button class="red"
onclick="deleteOrder('${o.id}')">
حذف سفارش
</button>

</div>

`).join("");

}

async function changeOrderStatus(id,status){

await fetch("/api/admin/orders/"+id+"/status",{
method:"POST",
headers:authHeaders(),
body:JSON.stringify({status})
});

loadOrders();

}

async function deleteOrder(id){

if(!confirm("سفارش حذف شود؟"))return;

await fetch("/api/admin/orders/"+id,{
method:"DELETE",
headers:authHeaders()
});

loadOrders();

}

function logout(){

sessionStorage.removeItem("rzvpn_admin_token");
location.reload();

}

function esc(v){

return String(v ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

TOKEN=sessionStorage.getItem("rzvpn_admin_token")||"";

if(TOKEN){

fetch("/api/admin/check",{
headers:authHeaders()
}).then(res=>{

if(res.ok){

showApp();
loadAll();

}else{

logout();

}

});

}

</script>

</body>
</html>
