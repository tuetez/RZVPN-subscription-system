<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RZVPN | سرویس‌های VPN</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Tahoma,Arial,sans-serif;
background:#070812;
color:#fff;
min-height:100vh;
}
header{
padding:20px;
background:linear-gradient(135deg,#11152d,#080914);
border-bottom:1px solid #242844;
text-align:center;
}
.logo{
font-size:34px;
font-weight:900;
letter-spacing:2px;
color:#55b7ff;
text-shadow:0 0 25px #168cff;
}
.subtitle{
margin-top:8px;
color:#aaaec5;
}
.container{
max-width:1100px;
margin:auto;
padding:25px 15px 60px;
}
.hero{
padding:30px 20px;
border:1px solid #252b49;
border-radius:25px;
background:linear-gradient(145deg,#11162d,#0b0d19);
box-shadow:0 20px 60px #0008;
margin-bottom:25px;
text-align:center;
}
.hero h1{
font-size:30px;
margin:5px 0 12px;
}
.hero p{
color:#aeb5cf;
line-height:2;
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:18px;
}
.card{
background:#101322;
border:1px solid #252b48;
border-radius:22px;
padding:20px;
transition:.2s;
}
.card:hover{
transform:translateY(-4px);
border-color:#428cff;
box-shadow:0 15px 40px #0008;
}
.card h2{
margin-top:0;
font-size:21px;
}
.price{
font-size:27px;
font-weight:bold;
color:#55b7ff;
margin:15px 0;
}
.info{
line-height:2;
color:#c7cbe0;
font-size:14px;
}
button{
border:0;
border-radius:13px;
padding:13px 18px;
font-size:15px;
font-weight:bold;
cursor:pointer;
background:#168cff;
color:#fff;
width:100%;
margin-top:12px;
}
button:hover{background:#006fd5}
.empty{
text-align:center;
padding:50px;
color:#aaa;
}
.modal{
display:none;
position:fixed;
inset:0;
background:#000b;
z-index:20;
padding:15px;
}
.modal-box{
max-width:500px;
margin:7vh auto;
background:#101322;
border:1px solid #2b3355;
border-radius:22px;
padding:25px;
}
input,textarea{
width:100%;
background:#080a14;
border:1px solid #303752;
color:white;
border-radius:12px;
padding:13px;
margin:7px 0 12px;
font-family:inherit;
}
textarea{min-height:100px;resize:vertical}
.close{
background:#292e42;
}
.success{
padding:15px;
border-radius:14px;
background:#10351f;
color:#8ff0ad;
margin-top:12px;
}
footer{
text-align:center;
padding:30px;
color:#777c95;
}
</style>
</head>

<body>

<header>
<div class="logo">RZVPN</div>
<div class="subtitle">FAST • SECURE • NO LIMITS</div>
</header>

<div class="container">

<section class="hero">
<h1>سرویس‌های RZVPN</h1>
<p>
اتصال پایدار، سرویس‌های متنوع و پلن‌های مختلف را بررسی کنید.
پلن موردنظر خود را انتخاب و سفارش خود را ثبت کنید.
</p>
</section>

<div id="products" class="grid">
<div class="empty">در حال دریافت محصولات...</div>
</div>

</div>

<div id="modal" class="modal">
<div class="modal-box">

<h2 id="modalTitle">ثبت سفارش</h2>

<form id="orderForm">

<input type="hidden" id="productId">

<label>نام و نام خانوادگی</label>
<input id="customerName" required placeholder="مثلاً رضا احمدی">

<label>شماره تماس / آیدی</label>
<input id="contact" required placeholder="شماره تماس یا آیدی">

<label>توضیحات</label>
<textarea id="note" placeholder="اگر توضیحی دارید بنویسید"></textarea>

<button type="submit">ثبت سفارش</button>
<button type="button" class="close" onclick="closeModal()">بستن</button>

</form>

<div id="result"></div>

</div>
</div>

<footer>
RZVPN — سرویس VPN
</footer>

<script>

let products=[];

async function loadProducts(){

try{

const res=await fetch("/api/products");
products=await res.json();

const box=document.getElementById("products");

if(!products.length){

box.innerHTML='<div class="empty">در حال حاضر محصول فعالی وجود ندارد.</div>';

return;
}

box.innerHTML=products.map(p=>`

<div class="card">

<h2>${esc(p.name)}</h2>

<div class="price">${esc(p.price || "تماس بگیرید")}</div>

<div class="info">

<div>📦 حجم: ${esc(p.volume || "-")}</div>
<div>⏱ مدت: ${esc(p.duration || "-")}</div>
<div>📍 لوکیشن: ${esc(p.location || "-")}</div>
<div>🔐 پروتکل: ${esc(p.protocol || "-")}</div>

<p>${esc(p.description || "")}</p>

</div>

<button onclick="openOrder('${p.id}')">
انتخاب این پلن
</button>

</div>

`).join("");

}catch(e){

document.getElementById("products").innerHTML=
'<div class="empty">خطا در دریافت محصولات.</div>';

}

}

function esc(v){

return String(v ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function openOrder(id){

const p=products.find(x=>String(x.id)===String(id));

if(!p)return;

document.getElementById("productId").value=p.id;
document.getElementById("modalTitle").textContent=
"سفارش: "+p.name;

document.getElementById("result").innerHTML="";
document.getElementById("modal").style.display="block";

}

function closeModal(){

document.getElementById("modal").style.display="none";

}

document.getElementById("orderForm").addEventListener("submit",async e=>{

e.preventDefault();

const body={
productId:document.getElementById("productId").value,
customerName:document.getElementById("customerName").value,
contact:document.getElementById("contact").value,
note:document.getElementById("note").value
};

const res=await fetch("/api/orders",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(body)
});

const data=await res.json();

if(data.success){

document.getElementById("result").innerHTML=
'<div class="success">✅ سفارش شما ثبت شد. کد سفارش: '+esc(data.orderId)+'</div>';

document.getElementById("orderForm").reset();

}else{

document.getElementById("result").innerHTML=
'<div class="success" style="background:#3a1616;color:#ffaaaa">❌ '+esc(data.error)+'</div>';

}

});

loadProducts();

</script>

</body>
</html>
