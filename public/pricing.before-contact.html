<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لیست قیمت RZVPN</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 background:#07111f;
 color:#eef5ff;
 font-family:Tahoma,Arial,sans-serif;
}

.hero{
 text-align:center;
 padding:35px 20px 20px;
}

.logo{
 font-size:32px;
 font-weight:900;
 letter-spacing:2px;
}

#provider{
 color:#9fb2ca;
 margin-top:10px;
}

.container{
 max-width:1100px;
 margin:auto;
 padding:20px;
}

#title{
 margin-bottom:20px;
}

.card{
 background:#0d1a2b;
 border:1px solid #243852;
 border-radius:20px;
 padding:22px;
 margin-bottom:20px;
 box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:18px;
}

.product{
 background:#101f33;
 border:1px solid #29415f;
 border-radius:18px;
 padding:20px;
 transition:.2s;
}

.product:hover{
 transform:translateY(-3px);
 border-color:#4ade80;
}

.product h2,
.product h3{
 margin-top:0;
}

.price{
 font-size:23px;
 font-weight:bold;
 color:#4ade80;
 margin:14px 0;
}

.info{
 line-height:2.2;
 color:#b9c7da;
}

.loading{
 text-align:center;
 padding:30px;
 color:#9fb2ca;
}

.error{
 color:#ff7b7b;
 text-align:center;
 padding:30px;
}
</style>
</head>

<body>

<div class="hero">

 <div class="logo">
  RZVPN
 </div>

 <p id="provider">
  ارائه‌دهنده خدمات RZVPN
 </p>

</div>

<div class="container">

 <div id="title"></div>

 <div id="products" class="grid">
  <div class="loading">
   در حال دریافت...
  </div>
 </div>

</div>

<script>

const token =
 location.pathname.split("/").filter(Boolean).pop();

function esc(value){

 return String(value ?? "")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

async function loadPricing(){

 const box =
  document.getElementById("products");

 try{

  const response =
   await fetch(
    "/api/pricing/" + encodeURIComponent(token),
    {
     cache:"no-store"
    }
   );

  const data =
   await response.json();

  if(!response.ok){
   throw new Error(
    data.error || "خطا در دریافت لیست قیمت"
   );
  }

  if(data.link){

   document.getElementById("title").innerHTML = `
    <div class="card">
     <h2>${esc(data.link.name || "لیست قیمت RZVPN")}</h2>
    </div>
   `;

  }

  const products =
   Array.isArray(data.products)
    ? data.products.filter(
       p => p.active !== false
      )
    : [];

  if(!products.length){

   box.innerHTML = `
    <div class="card">
     <div class="error">
      محصولی در این لیست وجود ندارد.
     </div>
    </div>
   `;

   return;
  }

  box.innerHTML =
   products.map(p => `

    <div class="product">

     <h3>
      ${esc(p.name)}
     </h3>

     <div class="price">
      ${esc(p.price || "-")}
     </div>

     <div>
      📦 حجم:
      ${esc(p.volume || "-")}
     </div>

     <div>
      ⏱ مدت:
      ${esc(p.duration || "-")}
     </div>

     ${
      p.locations
       ? `
        <div style="margin-top:8px">
         🌍 لوکیشن‌ها:
         ${esc(p.locations)}
        </div>
       `
       : ""
     }

     ${
      p.tunnel
       ? `
        <div style="margin-top:8px">
         🚇 ${esc(p.tunnel)}
        </div>
       `
       : ""
     }

     ${
      p.protocol
       ? `
        <div style="margin-top:8px">
         🔐 پروتکل:
         ${esc(p.protocol)}
        </div>
       `
       : ""
     }

     ${
      p.description
       ? `
        <p style="line-height:1.9">
         ${esc(p.description)}
        </p>
       `
       : ""
     }

    </div>

   `).join("");

 }
 catch(error){

  console.error(error);

  box.innerHTML = `
   <div class="card">
    <div class="error">
     ❌ خطا در دریافت لیست قیمت
     <br>
     <small>${esc(error.message)}</small>
    </div>
   </div>
  `;

 }

}

async function loadSettings(){

 try{

  const response =
   await fetch(
    "/api/settings",
    {cache:"no-store"}
   );

  if(!response.ok) return;

  const settings =
   await response.json();

  if(
   settings.provider &&
   document.getElementById("provider")
  ){

   document.getElementById("provider")
    .textContent =
     settings.provider;

  }

 }
 catch(error){

  console.log("settings unavailable");

 }

}

loadPricing();
loadSettings();

</script>

</body>
</html>
